name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate XML files
        run: python3 -c 'import re; p="android"+chr(58); m="<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns"+chr(58)+"android=\"http"+chr(58)+"//://android.com\"><uses-feature "+p+"name=\"android.software.leanback\" "+p+"required=\"false\"/><uses-feature "+p+"name=\"android.hardware.touchscreen\" "+p+"required=\"false\"/><application "+p+"allowBackup=\"true\" "+p+"label=\"Wanbo Minimal\" "+p+"icon=\"@android"+chr(58)+"drawable/sym_def_app_icon\" "+p+"theme=\"@style/Theme.AppCompat.NoActionBar\"><activity "+p+"name=\".MainActivity\" "+p+"exported=\"true\" "+p+"launchMode=\"singleTask\" "+p+"stateNotNeeded=\"true\" "+p+"screenOrientation=\"landscape\"><intent-filter><action "+p+"name=\"android.intent.action.MAIN\"/><category "+p+"name=\"android.intent.category.LAUNCHER\"/><category "+p+"name=\"android.intent.category.HOME\"/><category "+p+"name=\"android.intent.category.DEFAULT\"/><category "+p+"name=\"android.intent.category.LEANBACK_LAUNCHER\"/></intent-filter></activity></application></manifest>"; open("app/src/main/AndroidManifest.xml","w").write(m); [open(f,"w").write(re.sub(r"(?<!oid"+chr(58)+")(?<!xmlns"+chr(58)+r")\b(id|layout_width|layout_height|layout_weight|layout_margin|layout_marginTop|layout_marginBottom|background|orientation|padding|gravity|format24Hour|format12Hour|textColor|textSize|fontFamily|columnCount|rowCount|focusable|text|textAllCaps|clipToPadding|state_focused|shape|color|width|radius)=",p+r"\1=",open(f).read())) for f in ["app/src/main/res/drawable/card_selector.xml","app/src/main/res/layout/activity_main.xml"]]'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
