name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix XML files cleanly
        run: |
          python3 -c '
          import re
          pref = "andr" + "oid:"

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature A_name="android.software.leanback" A_required="false" />
              <uses-feature A_name="android.hardware.touchscreen" A_required="false" />
              <application
                  A_allowBackup="true"
                  A_label="Wanbo Minimal"
                  A_icon="@android:drawable/sym_def_app_icon"
                  A_theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      A_name=".MainActivity"
                      A_exported="true"
                      A_launchMode="singleTask"
                      A_stateNotNeeded="true"
                      A_screenOrientation="landscape">
                      <intent-filter>
                          <action A_name="android.intent.action.MAIN" />
                          <category A_name="android.intent.category.LAUNCHER" />
                          <category A_name="android.intent.category.HOME" />
                          <category A_name="android.intent.category.DEFAULT" />
                          <category A_name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>""".replace("A_", pref)
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          for path in ["app/src/main/res/drawable/card_selector.xml", "app/src/main/res/layout/activity_main.xml"]:
              txt = open(path).read()
              txt = re.sub(r"(?<!oid:)(?<!xmlns:)\b(id|layout_width|layout_height|layout_weight|layout_margin|layout_marginTop|layout_marginBottom|background|orientation|padding|gravity|format24Hour|format12Hour|textColor|textSize|fontFamily|columnCount|rowCount|focusable|text|textAllCaps|clipToPadding|state_focused|shape|color|width|radius)=", pref + r"\1=", txt)
              open(path, "w").write(txt)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
