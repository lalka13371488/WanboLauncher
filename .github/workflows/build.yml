name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean old XMLs and build Manifest
        run: |
          rm -rf app/src/main/res
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n<uses-feature android:name="android.software.leanback" android:required="false"/>\n<uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n<application android:allowBackup="true" android:label="Wanbo Minimal" android:icon="@android:drawable/sym_def_app_icon" android:theme="@style/Theme.AppCompat.NoActionBar">\n<activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:stateNotNeeded="true" android:screenOrientation="landscape">\n<intent-filter>\n<action android:name="android.intent.action.MAIN"/>\n<category android:name="android.intent.category.LAUNCHER"/>\n<category android:name="android.intent.category.HOME"/>\n<category android:name="android.intent.category.DEFAULT"/>\n<category android:name="android.intent.category.LEANBACK_LAUNCHER"/>\n</intent-filter>\n</activity>\n</application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
