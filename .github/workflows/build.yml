name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix XML files cleanly
        run: |
          python3 -c '
          import re

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="Wanbo Minimal"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          for path in ["app/src/main/res/drawable/card_selector.xml", "app/src/main/res/layout/activity_main.xml"]:
              txt = open(path).read()
              txt = re.sub(r"(?<!android:)(?<!xmlns:)\b(id|layout_width|layout_height|layout_weight|layout_margin|layout_marginTop|layout_marginBottom|background|orientation|padding|gravity|format24Hour|format12Hour|textColor|textSize|fontFamily|columnCount|rowCount|focusable|text|textAllCaps|clipToPadding|state_focused|shape|color|width|radius)=", r"android:\1=", txt)
              open(path, "w").write(txt)
          '
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
