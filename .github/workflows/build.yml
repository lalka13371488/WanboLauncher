name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Manifest
        run: |
          rm -rf app/src/main/res
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:X="http://schemas.android.com/apk/res/android">\n<uses-permission X:name="android.permission.INTERNET"/>\n<uses-feature X:name="android.software.leanback" X:required="false"/>\n<uses-feature X:name="android.hardware.touchscreen" X:required="false"/>\n<application X:allowBackup="true" X:usesCleartextTraffic="true" X:label="Wanbo Minimal" X:icon="@X:drawable/sym_def_app_icon" X:theme="@style/Theme.AppCompat.NoActionBar">\n<activity X:name=".MainActivity" X:exported="true" X:launchMode="singleTask" X:stateNotNeeded="true" X:screenOrientation="landscape">\n<intent-filter>\n<action X:name="android.intent.action.MAIN"/>\n<category X:name="android.intent.category.LAUNCHER"/>\n<category X:name="android.intent.category.HOME"/>\n<category X:name="android.intent.category.DEFAULT"/>\n<category X:name="android.intent.category.LEANBACK_LAUNCHER"/>\n</intent-filter>\n</activity>\n</application>\n</manifest>\n' | sed 's/X/android/g' > app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
       - name: Download Nature Wallpapers
        run: |
          mkdir -p app/src/main/res/drawable
          U="https://picsum.photos/seed"
          curl -sL "$U/forest1/1280/720.jpg" -o app/src/main/res/drawable/wall1.jpg
          curl -sL "$U/mountain2/1280/720.jpg" -o app/src/main/res/drawable/wall2.jpg
          curl -sL "$U/lake3/1280/720.jpg" -o app/src/main/res/drawable/wall3.jpg
          curl -sL "$U/sunset4/1280/720.jpg" -o app/src/main/res/drawable/wall4.jpg
          curl -sL "$U/river5/1280/720.jpg" -o app/src/main/res/drawable/wall5.jpg

      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
