name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore all XML files cleanly
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/layout
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/drawable/card_selector.xml
          echo "" | base64 -d > app/src/main/res/layout/activity_main.xml
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
